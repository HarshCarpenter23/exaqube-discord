# Brings up the stack. `frontend` is added in its block (docs/08).
# Order: db (healthy) -> migrate (schema + RO role) -> load (data) -> backend.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the schema and the read-only agent role, then exits.
  migrate:
    build: ./backend
    env_file: .env
    command: ["python", "-m", "scripts.migrate"]
    depends_on:
      db:
        condition: service_healthy

  # Idempotent data load, then exits. Reads CSVs mounted from ./data/dataset.
  load:
    build: ./backend
    env_file: .env
    command: ["python", "-m", "scripts.load_data"]
    volumes:
      - ./data/dataset:/data/dataset:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data/dataset:/data/dataset:ro
      - artifacts:/artifacts
    depends_on:
      load:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build: ./frontend
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
  artifacts:
